
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Pereira se Reactiva</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            color: #166534;
            text-align: center;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #15803d;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.6;
        }

        #respuesta {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
            text-align: center;
        }

        .exito {
            display: block !important;
            color: #166534;
            background: #dcfce7;
        }

        .error {
            display: block !important;
            color: #991b1b;
            background: #fee2e2;
        }

        a {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #15803d;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Pereira se Reactiva</h1>

        <p>Ingresa a tu cuenta</p>

        <form id="formLogin" autocomplete="off">

            <label for="correo">Correo electrónico</label>

            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="Ingresa tu correo electrónico"
                autocomplete="off"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresa tu contraseña"
                autocomplete="new-password"
                required
            >

            <button type="submit" id="btnLogin">
                Iniciar sesión
            </button>

        </form>

        <div id="respuesta"></div>

        <a href="/registro.html">
            ¿No tienes cuenta? Regístrate
        </a>

    </div>

    <script src="/js/auth.js"></script>
    <script src="/js/login.js"></script>

</body>
</html>
