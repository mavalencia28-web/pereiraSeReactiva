<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | Pereira se Reactiva</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .contenedor {
            background: white;
            width: 100%;
            max-width: 450px;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #166534;
            margin-bottom: 8px;
        }

        .subtitulo {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
            color: #334155;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #16a34a;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            border: none;
            border-radius: 7px;
            background: #15803d;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #166534;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #respuesta {
            margin-top: 20px;
            padding: 12px;
            border-radius: 7px;
            display: none;
            text-align: center;
        }

        .exito {
            display: block !important;
            color: #166534;
            background: #dcfce7;
        }

        .error {
            display: block !important;
            color: #991b1b;
            background: #fee2e2;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>Pereira se Reactiva</h1>

        <p class="subtitulo">
            Crea tu cuenta para participar en nuestra plataforma.
        </p>

        <form id="formRegistro">

            <label for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                maxlength="60"
                required
            >

            <label for="apellido">Apellido</label>
            <input
                type="text"
                id="apellido"
                maxlength="60"
                required
            >

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                maxlength="120"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                minlength="8"
                required
            >

            <label for="telefono">Teléfono (opcional)</label>
            <input
                type="tel"
                id="telefono"
                maxlength="20"
            >

            <button type="submit" id="btnRegistrar">
                Registrarse
            </button>

        </form>

        <div id="respuesta"></div>

    </div>

<script src="/js/registro.js" defer></script>

</body>
</html>
